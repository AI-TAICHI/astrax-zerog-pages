<!doctype html>
<html lang="ja"><head><meta name="robots" content="noindex,follow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問合せ | ASTRAX無重力飛行サービス（デザイン案）</title>
<style>html{background:#0b1f4b}:root{--navy:#0b1f4b;--navy2:#13306e;--orange:#e8590c;--ink:#1b2236;--mute:#5b6478;--line:#e3e8f2;--bg:#f5f7fc;--w:980px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#fff;line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--navy2);text-decoration:none}a:hover{color:var(--orange)}
.wrap{max-width:var(--w);margin:0 auto;padding:0 20px}
/* ヘッダー */
header.top{position:sticky;top:0;z-index:50;background:rgba(11,31,75,.97);backdrop-filter:blur(6px);box-shadow:0 2px 14px rgba(0,0,0,.18)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:6px}
.brand{display:flex;flex-direction:column;line-height:1.2;color:#fff}
.brand .b1{font-size:12px;letter-spacing:.32em;color:#ff8a4c;font-weight:700}
.brand .b2{font-size:19px;font-weight:800;letter-spacing:.04em}
.cta a{display:inline-block;background:var(--orange);color:#fff;padding:9px 20px;border-radius:999px;font-weight:700;font-size:14px}
.cta a:hover{background:#ff7a2f;color:#fff}
nav.menu{display:flex;gap:2px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.menu a{color:#c9d4ef;padding:7px 12px;font-size:13px;white-space:nowrap;border-radius:6px}
nav.menu a:hover{color:#fff;background:rgba(255,255,255,.1)}
nav.menu a.on{color:#fff;background:var(--orange)}
/* ヒーロー */
.hero{background:radial-gradient(1200px 400px at 80% -10%,#274a99 0,transparent 60%),linear-gradient(160deg,#0b1f4b 0%,#102a63 60%,#173a82 100%);color:#fff;padding:64px 0 56px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -10% -60px -10%;height:120px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0}
.hero .eyebrow{margin:0 0 10px;font-size:12px;letter-spacing:.35em;color:#ff9a63;text-transform:uppercase}
.hero h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.25;font-weight:800;letter-spacing:.02em}
/* 本文 */
main.wrap{padding-top:24px;padding-bottom:70px}
.sec{margin:0 0 44px}
.sec h2{font-size:24px;margin:0 0 18px;padding-left:14px;border-left:6px solid var(--orange);color:var(--navy);line-height:1.35}
.sec p{margin:0 0 14px}.sec p.small{font-size:13px;color:var(--mute)}
.sec ul{margin:0 0 14px;padding-left:22px}.sec li{margin:4px 0}
.sec b{color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 18px}
.grid figure{margin:0;border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:4/3;cursor:zoom-in;box-shadow:0 1px 4px rgba(11,31,75,.12);transition:transform .2s,box-shadow .2s}
.grid figure:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(11,31,75,.25)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
figure.one{margin:14px 0}figure.one img{max-width:100%;border-radius:12px;box-shadow:0 4px 18px rgba(11,31,75,.18)}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:14px 0}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(11,31,75,.2);background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn{display:inline-block;background:var(--navy);color:#fff;padding:11px 22px;border-radius:8px;font-weight:700;font-size:14px;transition:.2s}
.btn:hover{background:var(--orange);color:#fff;transform:translateY(-2px)}
.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
/* ライトボックス */
#lb{position:fixed;inset:0;background:rgba(5,12,32,.93);display:none;align-items:center;justify-content:center;z-index:100}
#lb.on{display:flex}#lb img{max-width:92vw;max-height:86vh;border-radius:8px}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;font-size:30px;width:52px;height:52px;border-radius:50%;cursor:pointer}
#lb .x{top:18px;right:18px}#lb .p{left:18px;top:50%}#lb .n{right:18px;top:50%}
/* フッター */
footer{background:var(--navy);color:#c9d4ef;padding:40px 0;text-align:center;font-size:14px}
footer a{color:#fff}footer .fb{font-size:22px;font-weight:800;letter-spacing:.3em;color:#fff;margin-bottom:10px}footer .cp{font-size:12px;opacity:.7}
@media(max-width:640px){.brand .b2{font-size:16px}.cta a{padding:7px 14px;font-size:12px}.hero{padding:44px 0 46px}.sec h2{font-size:20px}}

.ss{margin:6px 0 30px}.ss .stage{position:relative;border-radius:16px;overflow:hidden;background:#0b1f4b;aspect-ratio:16/9;box-shadow:0 10px 30px rgba(11,31,75,.3)}
.ss .stage img{width:100%;height:100%;object-fit:contain;display:block}
.ss .stage button{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--navy);font-size:28px;cursor:pointer}
.ss .sp{left:12px}.ss .sn{right:12px}
.ss .thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.ss .thumbs img{height:64px;width:auto;border-radius:8px;opacity:.55;cursor:pointer;transition:.2s;flex:0 0 auto}
.ss .thumbs img.on,.ss .thumbs img:hover{opacity:1;outline:3px solid var(--orange)}
/*tight*/
body{font-size:15px;line-height:1.7}
.sec{margin:0 0 32px}
.sec h2{font-size:22px;margin:0 0 12px}
.sec p{margin:0 0 9px}.sec li{margin:2px 0}.sec ul{margin:0 0 10px}
.sec p.small{font-size:13px}
.nt p{line-height:1.7;margin:0 0 8px}
.note{margin:0 0 24px}.nh{font-size:22px;margin:0 0 10px}
.sched .sec p,.sched .sec p.small{font-size:14px;margin:0 0 4px}
.sched .sec h2{font-size:20px}
.fl .fl-b{padding:14px 18px 16px}
.sched .fl .lead{font-size:14px}
.fl dl.spec dt{padding:6px 12px;font-size:12.5px}
.fl dl.spec dd{padding:6px 12px;font-size:13.5px;line-height:1.6}
.fl ul.fl-list li{padding:4px 0 4px 20px;font-size:13px;line-height:1.55}
.fl ul.fl-list li:before{top:11px}
.fl .sub{margin:14px 0 6px}
.fl .fnote{font-size:13px;line-height:1.6;padding:8px 12px}
.fl .pc .pd{font-size:12px;line-height:1.55}
.card span{font-size:12.5px}
main.wrap{padding-bottom:50px}
</style></head><body>
